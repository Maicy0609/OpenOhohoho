name: Build APK

# 触发：推送到 main / PR / 手动运行
# 文档、规则集、许可证等不影响 APK 的改动，不自动触发构建
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'rules/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'rules/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 从 Secret 还原签名 keystore（不提交到仓库）
      # 注意：build.gradle.kts 用 file() 相对 app 模块解析，故写入 app/keystore/
      - name: Restore signing keystore
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore/release.jks
          ls -la app/keystore/

      # 仓库未提交 gradle wrapper jar，运行时生成
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: open-ohohoho-apk
          path: |
            app/build/outputs/apk/release/*.apk
